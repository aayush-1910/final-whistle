# Scheduled data refresh: import latest results -> re-forecast what changed -> publish.
# Runs on GitHub's servers (free), independent of where the API/dashboard are hosted.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL           Supabase "Session pooler" connection string (IPv4; GitHub's
#                          runners cannot reach the IPv6-only direct host)
#   FOOTBALL_DATA_ORG_KEY  football-data.org API token
#
# A failed step makes the run fail, and GitHub emails the repository owner.
name: Data refresh

on:
  schedule:
    - cron: "30 5 * * *" # daily 05:30 UTC (11:00 IST), after the previous evening's matches
  workflow_dispatch:
    inputs:
      force:
        description: "Re-forecast even if nothing changed"
        type: boolean
        default: false

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check secrets are configured
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is not set"; exit 2; }
          test -n "$FOOTBALL_DATA_ORG_KEY" || { echo "::error::FOOTBALL_DATA_ORG_KEY secret is not set"; exit 2; }
      - name: Refresh
        run: python scripts/refresh.py --json refresh-report.json ${{ inputs.force && '--force' || '' }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: backend/refresh-report.json
          if-no-files-found: ignore
          retention-days: 30
